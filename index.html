<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Мини-игры</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #00d4ff;
      --text: #e0e0ff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 60px;
      text-shadow: 0 0 20px rgba(0,212,255,0.4);
    }
    .game-card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      margin: 16px 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(0,212,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .game-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 16px 48px rgba(0,212,255,0.25);
    }
    .game-card h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .game-card p {
      opacity: 0.8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>Выбери игру</h1>

  <div class="game-card" onclick="location.href='foodcraft.html'">
    <h2>🍳 Food Craft</h2>
    <p>Кулинарная алхимия, рецепты, крафт и прокачка</p>
  </div>

  <div class="game-card" onclick="location.href='balljump.html'">
    <h2>🎾 Ball Gravity</h2>
    <p>Пять шариков, верёвки, гравитация и драматичный финал</p>
  </div>

</body>
</html>
