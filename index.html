<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра для ❤️</title>
    <style>
        * { margin: 0; padding: 0; }
        body, html { 
            height: 100%; 
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ресайз canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let centerX, centerY;
        const ringRadius = 120;
        const ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 25, color: '#ff69b4' };
        let rope = null;
        let isRopeActive = false;
        const gravity = 0.4;
        const ropeStrength = 0.08;
        const damping = 0.97;

        function spawnBall() {
            centerX = canvas.width * 0.5;
            centerY = canvas.height * 0.25;
            ball.x = centerX;
            ball.y = centerY;
            ball.vx = 0;
            ball.vy = 0;
            rope = null;
            isRopeActive = false;
        }

        function constrainToRing() {
            const dx = ball.x - centerX;
            const dy = ball.y - centerY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            if (distance + ball.radius > ringRadius) {
                const angle = Math.atan2(dy, dx);
                ball.x = centerX + Math.cos(angle) * (ringRadius - ball.radius);
                ball.y = centerY + Math.sin(angle) * (ringRadius - ball.radius);
                const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                ball.vx = -Math.cos(angle) * speed * 0.6;
                ball.vy = -Math.sin(angle) * speed * 0.6;
            }
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        }

        canvas.addEventListener('click', (e) => {
            const pos = getEventPos(e);
            const dx = pos.x - ball.x;
            const dy = pos.y - ball.y;
            if (Math.sqrt(dx*dx + dy*dy) < ball.radius * 1.5) {
                isRopeActive = true;
                rope = { targetX: pos.x, targetY: pos.y };
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const pos = getEventPos(e.touches[0]);
            const dx = pos.x - ball.x;
            const dy = pos.y - ball.y;
            if (Math.sqrt(dx*dx + dy*dy) < ball.radius * 1.5) {
                isRopeActive = true;
                rope = { targetX: pos.x, targetY: pos.y };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isRopeActive && rope) {
                const pos = getEventPos(e);
                rope.targetX = pos.x;
                rope.targetY = pos.y;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isRopeActive && rope) {
                const pos = getEventPos(e.touches[0]);
                rope.targetX = pos.x;
                rope.targetY = pos.y;
            }
        });

        canvas.addEventListener('mouseup', () => isRopeActive = false);
        canvas.addEventListener('touchend', () => isRopeActive = false);

        function update() {
            centerX = canvas.width * 0.5;
            centerY = canvas.height * 0.25;
            
            ball.vy += gravity;
            
            if (isRopeActive && rope) {
                const dx = rope.targetX - ball.x;
                const dy = rope.targetY - ball.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxLength = 200;
                if (dist > maxLength) {
                    const force = (dist - maxLength) * ropeStrength;
                    ball.vx += (dx / dist) * force;
                    ball.vy += (dy / dist) * force;
                }
            }
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= damping;
            ball.vy *= damping;
            
            constrainToRing();
            
            if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.vy *= -0.5;
            }
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx *= -0.7;
            }
        }

        function drawBackground() {
            const gradient = ctx.createRadialGradient(
                canvas.width * 0.3, canvas.height * 0.2, 0,
                canvas.width * 0.3, canvas.height * 0.2, canvas.width
            );
            gradient.addColorStop(0, '#E3F2FD');
            gradient.addColorStop(0.5, '#87CEEB');
            gradient.addColorStop(1, '#98FB98');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawClouds() {
            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.shadowColor = 'rgba(255,255,255,0.3)';
            ctx.shadowBlur = 10;
            
            const clouds = [
                {x: canvas.width * 0.2 + Math.sin(Date.now() * 0.001) * 20, y: 80, size: 60},
                {x: canvas.width * 0.6 + Math.cos(Date.now() * 0.0008) * 15, y: 120, size: 80},
                {x: canvas.width * 0.85 + Math.sin(Date.now() * 0.0009) * 25, y: 60, size: 70}
            ];
            
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + 30, cloud.y, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x + 60, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + 20, cloud.y - 20, cloud.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawRing() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 12;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawRope() {
            if (!rope || !isRopeActive) return;
            ctx.strokeStyle = '#ff1493';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(rope.targetX, rope.targetY);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawBall() {
            ctx.fillStyle = ball.color;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(ball.x - 10, ball.y - 10, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            drawBackground();
            drawClouds();
            update();
            drawRing();
            drawRope();
            drawBall();
            requestAnimationFrame(gameLoop);
        }

        // ЗАПУСК
        spawnBall();
        gameLoop();
    </script>
</body>
</html>
